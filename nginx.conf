server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;

  # Astro-hashed bundles (/_astro/*.HASH.css|js) — filename changes with content,
  # so a long immutable cache is safe and optimal. (^~ beats the regex below.)
  location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything else (images, fonts, HTML) is referenced by stable filenames —
  # revalidate every load so content updates show up immediately.
  location ~* \.(js|css|png|jpe?g|webp|svg|woff2?)$ {
    add_header Cache-Control "no-cache";
  }
}
